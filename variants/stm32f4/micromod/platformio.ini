[env:micromod_stm32f405_sx1276]
extends = arduino_base
platform = platformio/ststm32@19.6.0
board = sparkfun_micromod_f405
board_level = extra
board_build.ldscript = variants/stm32f4/micromod/stm32f405.ld
extra_scripts =
  ${env.extra_scripts}
build_flags =
  ${arduino_base.build_flags}
  -Isrc/platform/stm32f4
  -Ivariants/stm32f4/micromod
  -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -DHSE_VALUE=12000000U
  -DUSBCON
  -DHAL_DAC_MODULE_ONLY
  -DHAL_RNG_MODULE_ENABLED
  -DPIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
  -DMESHTASTIC_EXCLUDE_SCREEN=1
  -DMESHTASTIC_EXCLUDE_BLUETOOTH=1
  -DMESHTASTIC_EXCLUDE_WIFI=1
  -DMESHTASTIC_EXCLUDE_MQTT=1
  -DMESHTASTIC_EXCLUDE_GPS=1
  -DMESHTASTIC_EXCLUDE_I2C=1
  -DMESHTASTIC_EXCLUDE_POWER_FSM=1
  -DMESHTASTIC_EXCLUDE_AUDIO=1
  -DMESHTASTIC_EXCLUDE_ATAK=1
  -DMESHTASTIC_EXCLUDE_INPUTBROKER=1
  -DMESHTASTIC_EXCLUDE_TZ=1
  -DMESHTASTIC_EXCLUDE_ENVIRONMENTAL_SENSOR=1
  -DMESHTASTIC_EXCLUDE_AIR_QUALITY_SENSOR=1
  -DMESHTASTIC_EXCLUDE_ACCELEROMETER=1
  -DMESHTASTIC_EXCLUDE_MAGNETOMETER=1
  -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
  -DMESHTASTIC_EXCLUDE_CANNEDMESSAGES=1
  -DMESHTASTIC_EXCLUDE_RANGETEST=1
  -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
  -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
  -DMESHTASTIC_EXCLUDE_POWER_TELEMETRY=1
  -DMESHTASTIC_EXCLUDE_SERIAL=1
  -DRADIOLIB_EXCLUDE_SX126X=1
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  -DMAX_NUM_NODES=40
build_src_filter =
  ${arduino_base.build_src_filter}
  -<platform/esp32/> -<platform/nrf52/> -<platform/rp2xx0/> -<platform/stm32wl/>
  -<nimble/> -<mesh/api/> -<mesh/wifi/> -<mesh/http/> -<mesh/eth/> -<mesh/raspihttp/>
  -<modules/esp32/> -<input/> -<buzz/>
lib_deps =
  ${arduino_base.lib_deps}
  ${radiolib_base.lib_deps}
  https://github.com/caveman99/Crypto/archive/1aa30eb536bd52a576fde6dfa393bf7349cf102d.zip
upload_protocol = stlink
